apiVersion: apps/v1
kind: Deployment

metadata:
  name: ran-automation

  labels:
    app: ran-automation

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ran-automation

  template:
    metadata:
      labels:
        app: ran-automation

    spec:
      containers:
        - name: ran-automation

          image: ran-automation-resilience-lab:v2.6.0-r1

          imagePullPolicy: IfNotPresent

          env:
            - name: APPLICATION_RELEASE
              value: "APP-v2.6.0"

            - name: OPTIMIZATION_INTERVAL_SECONDS
              value: "60"

            - name: OPTIMIZATION_MAX_TARGET_CELLS
              value: "3"

            - name: OPTIMIZATION_MAX_CANDIDATES
              value: "18"

            - name: AI_ADVISOR_ENABLED
              value: "true"

            - name: AI_CONTROL_ENABLED
              value: "true"

            - name: AI_CONTROL_INTERVAL_SECONDS
              value: "60"

            - name: AI_CONTROL_BAD_DECISION_THRESHOLD
              value: "5"

            - name: AI_ADVISOR_MODEL
              value: "gpt-5.6-luna"

            - name: AI_ADVISOR_TIMEOUT_SECONDS
              value: "30"

            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-api-key
                  key: OPENAI_API_KEY
                  optional: true

          envFrom:
            - configMapRef:
                name: ran-automation-config

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /cells
              port: 8000

            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: 8000

            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
